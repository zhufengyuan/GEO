<div class="page-center" style="max-width: 1100px;">
  <!-- 头部 -->
  <div class="card ds-head" style="padding:14px 18px;">
    <div class="ds-head-row">
      <div class="ds-head-left">
        <div class="ds-head-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2f6bd8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/><path d="M9 21V9"/></svg>
        </div>
        <div class="ds-head-title">数据统计</div>
      </div>
      <div class="ds-head-right">
        <div class="ds-filters" id="timeFilters">
          <button class="ds-filter active" data-range="7">近7天</button>
          <button class="ds-filter" data-range="30">近30天</button>
          <button class="ds-filter" data-range="90">近90天</button>
          <button class="ds-filter" data-range="all">全部</button>
        </div>
        <button class="btn-solid btn-sm" id="exportBtn" style="font-size:12px;">导出报告</button>
        <button class="btn-primary btn-sm" id="refreshBtn" style="font-size:12px;">刷新</button>
      </div>
    </div>
  </div>

  <!-- KPI 卡片区（带环比） -->
  <div class="ds-kpi-grid">
    <div class="ds-kpi-card">
      <div class="ds-kpi-ring">
        <svg viewBox="0 0 80 80" class="ds-ring-svg">
          <circle cx="40" cy="40" r="32" fill="none" stroke="rgba(99,102,241,0.12)" stroke-width="6"/>
          <circle cx="40" cy="40" r="32" fill="none" stroke="#6366f1" stroke-width="6" stroke-linecap="round"
            stroke-dasharray="0 201" class="ds-ring-fill" id="ringArticles"/>
        </svg>
        <div class="ds-ring-value" id="kpiArticles">0</div>
      </div>
      <div class="ds-kpi-info">
        <div class="ds-kpi-label">生成文章数</div>
        <div class="ds-kpi-badge" id="kpiBadgeArticles">近7天</div>
      </div>
      <div class="ds-mom" id="momArticles">—</div>
    </div>

    <div class="ds-kpi-card">
      <div class="ds-kpi-ring">
        <svg viewBox="0 0 80 80" class="ds-ring-svg">
          <circle cx="40" cy="40" r="32" fill="none" stroke="rgba(168,85,247,0.12)" stroke-width="6"/>
          <circle cx="40" cy="40" r="32" fill="none" stroke="#a855f7" stroke-width="6" stroke-linecap="round"
            stroke-dasharray="0 201" class="ds-ring-fill" id="ringLinks"/>
        </svg>
        <div class="ds-ring-value" id="kpiLinks">0</div>
      </div>
      <div class="ds-kpi-info">
        <div class="ds-kpi-label">追踪链接数</div>
        <div class="ds-kpi-badge" id="kpiBadgeLinks">全量</div>
      </div>
      <div class="ds-mom" id="momLinks">—</div>
    </div>

    <div class="ds-kpi-card">
      <div class="ds-kpi-ring">
        <svg viewBox="0 0 80 80" class="ds-ring-svg">
          <circle cx="40" cy="40" r="32" fill="none" stroke="rgba(34,197,94,0.12)" stroke-width="6"/>
          <circle cx="40" cy="40" r="32" fill="none" stroke="#22c55e" stroke-width="6" stroke-linecap="round"
            stroke-dasharray="0 201" class="ds-ring-fill" id="ringIndexed"/>
        </svg>
        <div class="ds-ring-value" id="kpiIndexed">0</div>
      </div>
      <div class="ds-kpi-info">
        <div class="ds-kpi-label">已收录数</div>
        <div class="ds-kpi-badge" id="kpiBadgeIndexed">近7天</div>
      </div>
      <div class="ds-mom" id="momIndexed">—</div>
    </div>

    <div class="ds-kpi-card">
      <div class="ds-kpi-ring">
        <svg viewBox="0 0 80 80" class="ds-ring-svg">
          <circle cx="40" cy="40" r="32" fill="none" stroke="rgba(249,115,22,0.12)" stroke-width="6"/>
          <circle cx="40" cy="40" r="32" fill="none" stroke="#f97316" stroke-width="6" stroke-linecap="round"
            stroke-dasharray="0 201" class="ds-ring-fill" id="ringCited"/>
        </svg>
        <div class="ds-ring-value" id="kpiCited">0</div>
      </div>
      <div class="ds-kpi-info">
        <div class="ds-kpi-label">AI引用次数</div>
        <div class="ds-kpi-badge" id="kpiBadgeCited">全量</div>
      </div>
      <div class="ds-mom" id="momCited">—</div>
    </div>
  </div>

  <!-- 趋势图区 -->
  <div class="card ds-trend" style="padding:16px 18px; margin-top:12px;">
    <div class="ds-trend-row">
      <div class="ds-trend-title">📈 数据趋势</div>
      <div class="ds-trend-legend">
        <span class="ds-leg"><span class="dot dot-a"></span>文章</span>
        <span class="ds-leg"><span class="dot dot-b"></span>收录</span>
      </div>
    </div>
    <div class="ds-trend-plot" id="dsTrendPlot">
      <svg id="dsTrendSvg" class="ds-trend-svg" viewBox="0 0 1000 260" preserveAspectRatio="none"></svg>
      <div class="ds-tooltip" id="dsTooltip" style="display:none;"></div>
    </div>
  </div>

  <!-- CTA 操作区 -->
  <div class="ds-cta-row">
    <button class="ds-cta-btn" onclick="window.navigateTo?.('article-writing')">
      <span class="ds-cta-ico">✎</span> 开始创作文章
    </button>
    <button class="ds-cta-btn" onclick="window.navigateTo?.('optimization-plan')">
      <span class="ds-cta-ico">🎯</span> 查看优化方案
    </button>
    <button class="ds-cta-btn" onclick="window.navigateTo?.('article-manager')">
      <span class="ds-cta-ico">📋</span> 管理已发布内容
    </button>
  </div>

  <!-- 明细数据区 -->
  <div class="card ds-data" style="padding:14px 18px; margin-top:12px;">
    <div class="ds-data-head">
      <div class="ds-trend-title">🧾 明细数据</div>
      <div class="ds-views" id="dsViewBtns"></div>
    </div>
    <div class="page-muted" id="dsMeta" style="margin-top:8px;">等待数据…</div>
    <div class="table-wrap ds-table-scroll" id="dsTableWrap" style="margin-top:10px;">
      <table>
        <thead id="dsThead"></thead>
        <tbody id="dsTbody"></tbody>
      </table>
    </div>
    <div class="ds-card-grid" id="dsCardGrid" style="margin-top:10px; display:none;"></div>
    <!-- 空状态引导 -->
    <div class="ds-empty" id="dsEmpty" style="display:none;">
      <div class="ds-empty-icon">📡</div>
      <div class="ds-empty-title">暂无统计数据</div>
      <div class="ds-empty-desc">请确保已连接数据源并发布内容，系统将自动统计文章数、收录数、AI引用等指标</div>
      <div class="ds-empty-actions">
        <button class="btn-primary" onclick="window.navigateTo?.('article-writing')">去创作内容</button>
        <button class="btn-solid" id="refreshBtn2" style="margin-left:10px;">手动刷新</button>
      </div>
    </div>
  </div>
</div>

<style>
/* ===== 深蓝科技风整体 ===== */
.ds-head {
  border: 1px solid rgba(47,107,216,0.15);
  background: linear-gradient(135deg, rgba(47,107,216,0.04) 0%, rgba(15,23,42,0.02) 100%);
}

.ds-head-row {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
}
.ds-head-left {
  display: inline-flex; align-items: center; gap: 10px;
}
.ds-head-icon {
  width: 34px; height: 34px; border-radius: 10px; display: inline-flex; align-items: center; justify-content: center;
  background: linear-gradient(135deg, rgba(47,107,216,0.15), rgba(99,102,241,0.08));
}
.ds-head-title {
  font-size: 16px; font-weight: 800; color: #0f172a;
}
.ds-head-right {
  display: flex; align-items: center; justify-content: flex-end; gap: 10px; flex-wrap: wrap;
}

.ds-filters {
  display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
}
.ds-filter {
  border: 1px solid rgba(47,107,216,0.18);
  background: rgba(47,107,216,0.06);
  color: #2563eb;
  padding: 5px 12px; border-radius: 999px; font-size: 12px; font-weight: 600; cursor: pointer; transition: all .2s;
}
.ds-filter:hover { background: rgba(47,107,216,0.12); }
.ds-filter.active {
  background: linear-gradient(135deg, #2f6bd8, #4f46e5);
  border-color: #2f6bd8; color: #fff; box-shadow: 0 2px 8px rgba(47,107,216,0.25);
}

/* KPI 卡片 */
.ds-kpi-grid {
  margin-top: 12px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px;
}
.ds-kpi-card {
  border: 1px solid rgba(47,107,216,0.14);
  border-radius: 16px;
  background: linear-gradient(135deg, rgba(255,255,255,0.95), rgba(47,107,216,0.03));
  padding: 16px;
  position: relative;
  overflow: hidden;
  transition: transform .2s, box-shadow .2s;
}
.ds-kpi-card:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 24px rgba(47,107,216,0.08);
}
.ds-kpi-card::after {
  content: '';
  position: absolute; top: 0; right: 0; width: 80px; height: 80px;
  background: radial-gradient(circle, rgba(47,107,216,0.06) 0%, transparent 70%);
  pointer-events: none;
}

/* 环形进度 */
.ds-kpi-ring {
  width: 60px; height: 60px; position: relative; margin-bottom: 10px;
}
.ds-ring-svg {
  width: 60px; height: 60px; transform: rotate(-90deg);
}
.ds-ring-fill {
  transition: stroke-dasharray .8s ease;
}
.ds-ring-value {
  position: absolute; top: 50%; left: 24px; transform: translate(-50%, -50%);
  font-size: 20px; font-weight: 900; color: #0f172a;
}

.ds-kpi-info {
  position: relative; z-index: 1;
}
.ds-kpi-label {
  font-size: 12px; color: #64748b; font-weight: 600; margin-bottom: 4px;
}
.ds-kpi-badge {
  display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 999px;
  background: rgba(47,107,216,0.08); color: #2563eb; font-weight: 700;
}

/* 环比指示 */
.ds-mom {
  position: absolute; top: 14px; right: 14px;
  font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 999px;
  color: #64748b; background: rgba(15,23,42,0.04);
}
.ds-mom-up {
  color: #16a34a; background: rgba(34,197,94,0.1);
}
.ds-mom-down {
  color: #dc2626; background: rgba(239,68,68,0.1);
}

/* 趋势区 */
.ds-trend {
  border: 1px solid rgba(47,107,216,0.12);
  background: linear-gradient(135deg, rgba(255,255,255,0.95), rgba(47,107,216,0.02));
}
.ds-trend-row {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
}
.ds-trend-title {
  display: inline-flex; align-items: center; gap: 8px;
  font-size: 15px; font-weight: 800; color: #0f172a;
}
.ds-trend-legend {
  display: flex; align-items: center; gap: 14px; font-size: 12px; color: #64748b;
}
.ds-trend-plot {
  margin-top: 14px; height: 240px; border-radius: 14px;
  border: 1px solid rgba(47,107,216,0.1);
  background: linear-gradient(180deg, rgba(47,107,216,0.02), rgba(255,255,255,0.6));
  position: relative; overflow: hidden;
}
.ds-trend-svg {
  position: absolute; inset: 0; width: 100%; height: 240px; display: block;
}
.ds-tooltip {
  position: absolute; pointer-events: none;
  background: rgba(15,23,42,0.95); color: #fff;
  padding: 8px 12px; border-radius: 10px; font-size: 12px; line-height: 1.6;
  backdrop-filter: blur(12px);
}

/* CTA 操作区 */
.ds-cta-row {
  margin-top: 14px; display: flex; gap: 10px; flex-wrap: wrap;
}
.ds-cta-btn {
  flex: 1; min-width: 160px;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 12px 16px; border-radius: 12px; border: 1px solid rgba(47,107,216,0.18);
  background: linear-gradient(135deg, rgba(47,107,216,0.06), rgba(99,102,241,0.03));
  color: #2563eb; font-size: 13px; font-weight: 700; cursor: pointer;
  transition: all .2s;
}
.ds-cta-btn:hover {
  background: linear-gradient(135deg, rgba(47,107,216,0.12), rgba(99,102,241,0.06));
  border-color: #2f6bd8; box-shadow: 0 4px 12px rgba(47,107,216,0.1);
}
.ds-cta-ico {
  font-size: 16px;
}

/* 明细数据 */
.ds-data-head {
  display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
}
.ds-views {
  display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
}
.ds-view {
  border: 1px solid rgba(99,102,241,0.18);
  background: rgba(99,102,241,0.06);
  color: #6366f1; padding: 5px 12px; border-radius: 999px;
  font-size: 12px; font-weight: 600; cursor: pointer; transition: all .2s;
}
.ds-view:hover { background: rgba(99,102,241,0.12); }
.ds-view.active {
  background: linear-gradient(135deg, #6366f1, #7c3aed);
  border-color: #6366f1; color: #fff; box-shadow: 0 2px 8px rgba(99,102,241,0.25);
}

.ds-card-grid {
  display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px;
}
.ds-card {
  border: 1px solid rgba(47,107,216,0.12); border-radius: 14px;
  background: linear-gradient(135deg, rgba(255,255,255,0.95), rgba(47,107,216,0.02));
  padding: 12px; position: relative; overflow: hidden;
}
.ds-card::before {
  content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px;
  background: var(--ds-accent, #7c3aed);
}
.ds-card-title {
  font-weight: 800; color: #0f172a; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.ds-card-value {
  font-size: 24px; font-weight: 900; color: #0f172a; margin-top: 10px;
}
.ds-card-sub {
  color: #64748b; font-size: 12px; margin-top: 6px; line-height: 1.7;
}
.ds-card-kvs {
  display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px;
}
.ds-card-kv {
  display: inline-flex; align-items: center; gap: 6px; padding: 3px 8px; border-radius: 999px;
  background: rgba(47,107,216,0.05); border: 1px solid rgba(47,107,216,0.12);
  color: #475569; font-size: 11px; max-width: 100%;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}

.ds-table-scroll {
  overflow-x: auto; overflow-y: auto; max-height: 360px;
}
.ds-table-scroll table { width: max-content; min-width: 100%; }
.ds-table-scroll thead th { white-space: normal; word-break: break-all; }

/* 空状态 */
.ds-empty {
  text-align: center; padding: 48px 20px;
}
.ds-empty-icon { font-size: 48px; margin-bottom: 14px; opacity: .5; }
.ds-empty-title { font-size: 16px; font-weight: 800; color: #475569; margin-bottom: 8px; }
.ds-empty-desc { font-size: 13px; color: #94a3b8; max-width: 420px; margin: 0 auto 20px; line-height: 1.7; }
.ds-empty-actions { display: flex; justify-content: center; gap: 10px; }

.ds-leg { display: inline-flex; align-items: center; gap: 6px; }
.dot { width: 10px; height: 10px; border-radius: 999px; }
.dot-a { background: #6366f1; box-shadow: 0 0 6px rgba(99,102,241,0.4); }
.dot-b { background: #22c55e; box-shadow: 0 0 6px rgba(34,197,94,0.4); }

@media (max-width: 1100px) {
  .ds-kpi-grid, .ds-card-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 640px) {
  .ds-kpi-grid, .ds-card-grid { grid-template-columns: 1fr; }
  .ds-head-row { flex-direction: column; align-items: flex-start; }
  .ds-cta-row { flex-direction: column; }
}
</style>
</parameter>
